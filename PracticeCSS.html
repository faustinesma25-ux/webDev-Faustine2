<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice CSS</title>
    <style>
        p{
            font-family: Georgia, 'Times New Roman', Times, serif;
            color: burlywood;
            font-weight: 500;
        }
        .momo{
            font-style: italic;
            color: darkgreen;
            font-family: 'Courier New', Courier, monospace;
        }
        .cemong{
            font-style: oblique;
            color: rgb(1, 53, 112);
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }
    </style>
</head>

<body>
    <p style="font-weight: bold; color: maroon;">This is the first sentence</p>
    <p>This is the second sentence</p>
    <p class="momo">This is the third senetnce</p>
    <p class="cemong">This is the forth senetnce</p>
</body>
</html>
